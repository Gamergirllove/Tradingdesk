<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a12"><link rel="manifest" href="/manifest.webmanifest">
<title>Desk</title><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/base.css?v=hud2"></head>
<body><div class="wrap" style="padding-top:18vh">
<div class="card"><h1>Trading Desk</h1><p class="dim small">Enter your dashboard password.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password">
<button class="primary" id="go">Unlock</button><p id="msg" class="small" style="color:var(--red)"></p></div></div>
<script>
async function go(){const r=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw.value})});
const j=await r.json();if(j.ok)location.reload();else msg.textContent=j.error||'failed'}
document.getElementById('go').onclick=go;pw.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>

# Trading desk config. Thresholds and limits live here, not in prompts.
# Changes to anything under risk: or bots.*.mode go through APPROVE on the dashboard
# (they are written to <data>/overrides.yaml, which is merged on top of this file).

desk:
  mode_ceiling: live          # highest rung any bot may run at: shadow | paper | demo | live
  skip_demo: true             # paper goes straight to live (no demo key needed)
  timezone: America/Los_Angeles
  daily_summary_hour: 8       # local hour the daily summary is pushed
  paper_bankroll: 50          # starting cash for each paper bot
  ai_credit_milestone_usd: 5  # push "add this to Claude" once live profit reaches this

venue:
  name: kalshi
  rest_prod: https://external-api.kalshi.com/trade-api/v2
  rest_prod_alt: https://api.elections.kalshi.com/trade-api/v2
  rest_demo: https://external-api.demo.kalshi.co/trade-api/v2
  poll_seconds: 10            # orderbook refresh for an active market
  trades_poll_seconds: 30
  universe_refresh_seconds: 120
  universe_series: [KXBTC15M]  # bitcoin 15-minute markets only

underlying:                   # spot feed used by code for fair value (public, no key)
  source: coinbase
  products: {KXBTCD: BTC-USD, KXBTC: BTC-USD, KXBTC15M: BTC-USD, KXETHD: ETH-USD, KXETH: ETH-USD}
  poll_seconds: 30

judge:
  backend: rules              # rules (free, code-only answers) | claude (Haiku 5.5, uses credit)
  url: http://127.0.0.1:8701
  model: claude-haiku-5-5
  pinned_version: ""          # empty = pin to the first version that answers; mismatch vetoes orders
  mode: batched               # batched = one call per battery; isolated = one call per question (costs more)
  deadline_ms: 9000           # no answer by then = hold
  max_tokens: 600
  daily_budget_usd: 2.00      # judge + seats combined
  fallback_to_rules: true     # when Claude can't answer (cap reached, no credit, outage) the free rules judge answers
  consecutive_errors_halt: 5
  pricing_per_mtok:           # Claude Haiku 5.5 list prices
    input: 0.10
    output: 0.50
    cache_write: 0.125
    cache_read: 0.01

calibration:
  min_samples: 50             # Platt scaling only after this many labelled answers
  apply_requires_approve: true

bots:
  gambler:
    enabled: true
    mode: shadow              # rung: shadow -> paper -> demo -> live
    decision_every_s: 60
    size_pct_equity: 50       # stake per trade as % of the account, from rules, never from model confidence
    take_profit_pct: 5        # +5% on the contract held, rested as a post-only maker order (0 fee)
    stop_c: 5
    stop_buffer_c: 1          # stop goes beyond the recent swing low/high, not at a round number
    exit_minutes_before_close: 20
    max_hold_minutes: 90
    volume_exit_ratio: 0.2    # last-30m volume below 20% of its pace -> close within 60s
  sports:
    enabled: true
    mode: paper
    series: [KXNFLGAME, KXNCAAFGAME, KXNBAGAME, KXNHLGAME]
    scan_every_s: 20
    size_pct_equity: 50       # of the account per bet (shared with the Gambler)
    take_profit_pct: 10       # on the contract: 60c -> 66c
    stop_loss_pct: 5          # on the contract: 60c -> 57c
    max_open_bets: 2
    daily_loss_stop: false    # no daily stop for Sports; its P&L is left out of the Gambler's daily limit
    pregame_hours: 12         # pregame bets only within 12h of the start
    live: true                # in-game bets where ESPN has a live win probability (NFL, NBA, college FB)
    min_edge_c: {pregame: 3, live: 5}     # fair minus Kalshi ask, after the entry fee
    max_edge_c: {pregame: 15, live: 20}   # a bigger gap usually means stale or mismatched data
    max_spread_c: 3
    min_price: 0.15
    max_price: 0.90
    min_volume_24h: 200
    confirm_scans: 2          # the gap has to be there on two checks in a row
    reentry_after_stop_min: 120   # after a stop, no new bet on that game for 2 hours
    hold_until_start: true    # a bet placed before the game isn't sold (no take-profit, no stop) until it starts
    max_live_wp_reads: 8
  house:
    enabled: false            # only one 15-minute market exists at a time; the Gambler gets it
    mode: shadow
    scan_every_s: 180
    judge_every_s: 600
    judge_ttl_s: 900          # answers older than this are stale -> pull quotes
    quote_contracts: 5
    max_inventory: 15
    min_half_spread_c: 1
    vol_mult: 0.8
    inventory_skew_c: 0.4     # cents of skew per contract of inventory
    band_c: 8                 # range guard half-width around session start mid
    stop_minutes_before_close: 30
    requote_min_change_c: 1

policy:
  sports:
    worth_min: 0.50
    exec_degraded_max: 0.50
  gambler:
    trend_min: 0.50
    setup_ge2_min: 0.55
    action_conf_min: 0.60
    worth_min: 0.55
    exec_degraded_max: 0.50
    min_model_edge_c: 3       # code-side fair value edge required in the same direction
    flow_min: 0.55            # aggregated spot flow must favor the side taken
  house:
    breakout_pause: 0.40
    toxic_widen: 0.50
    toxic_pull: 0.70
    env_ge2_min: 0.40
    volume_alive_min: 0.30
  scan:
    worth_min: 0.50

risk:
  max_order_contracts: 500
  max_position_contracts: 500
  max_total_exposure_usd: 100
  daily_loss_limit_usd: 5     # bot losses only (trades you force by hand don't count); halts until you approve
  resume_loss_add_usd: 6      # each Resume after that halt allows $6 more loss from where the day stands (resets at midnight)
  min_edge_over_fees_c: 1     # taker entries: code edge must beat fees by this much per contract
  min_quote_edge_c: 0.5       # maker quotes: distance from mid minus adverse-selection estimate
  max_state_age_s: 30
  price_min: 0.03
  price_max: 0.97
  balance_reserve_usd: 2

funnel:
  max_spread_c: 4
  min_volume_24h: 500
  min_open_interest: 200
  min_minutes_to_close: 45
  max_minutes_to_close: 1440
  price_floor: 0.08
  price_ceiling: 0.92
  depth_check_top_k: 6
  min_top3_depth: 30
  judge_top_n: 4
  house_min_spread_c: 1

bench_ttl_minutes:            # reason -> how long a rejected market stays benched
  spread_wide: 15
  low_volume: 60
  low_open_interest: 60
  price_tail: 30
  thin_book: 20
  no_edge: 10
  no_fair_value: 30
  judge_no: 30
  too_early: 20
  volume_dead: 120
  toxic: 30
  breakout: 30
  closing_soon: 100000
  malformed: 100000

seats:
  enabled: true
  model: claude-haiku-5-5
  review_model: claude-haiku-5-5   # set to claude-opus-5-5 for the weekly review if budget allows
  max_turns: 10
  budget_per_run_usd: 0.01
  review_budget_usd: 0.03
  schedule:                         # local time
    risk: "07:55"
    exit: "07:58"
    head: "08:00"
    search_weekday: 0               # Monday
    search: "07:30"
    review_weekday: 6               # Sunday
    review: "18:00"

series_profiles:              # per-series overrides on top of funnel / bots settings
  KXBTC15M:                   # "BTC up in the next 15 mins?" one market every 15 minutes
    funnel: {min_minutes_to_close: 2, max_minutes_to_close: 16, max_spread_c: 3, min_volume_24h: 0,
             min_open_interest: 0, min_history_points: 3, bench_scale: 0.05}
    gambler:
      exit_minutes_before_close: 1
      max_hold_minutes: 15
      decision_every_s: 20    # checks 3x a minute so a speed-up after halftime isn't missed
      halftime_rule:          # yours: at halftime, the side at 70c+ with BTC $100+ past target and speeding up
        enabled: true         # (both YES and NO), on top of the bot's own checks
        half_minutes: 7.5
        latest_minutes: 2
        min_price: 0.70
        min_distance_usd: 100
    house: {stop_minutes_before_close: 3}
  KXBTCD:
    funnel: {min_history_points: 20}

spot_flow:                    # aggr-style aggregated BTC spot trades + books (BRTI venues reachable from the US)
  enabled: true
  poll_seconds: 10
  venues: [coinbase, kraken, bitstamp, gemini]

notify:
  ntfy_server: https://ntfy.sh
